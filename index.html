<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14130f">
  <title>Tao Meditation</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="home">
    <header>
      <h1>Tao Meditation</h1>
      <p class="sub">Guided practice with the Tao Te Ching</p>
    </header>

    <section class="card" id="book">
      <h2>Book</h2>
      <p id="book-status">Checking…</p>
      <div class="row">
        <label class="btn" id="book-load">
          Load EPUB
          <input type="file" id="book-file" accept=".epub,application/epub+zip" hidden>
        </label>
        <button class="btn ghost" id="book-remove" hidden>Remove</button>
      </div>
      <p class="note">The text stays on this device. Without the book, sessions run without the Tao passages.</p>
    </section>

    <section id="sessions"></section>

    <section class="card" id="settings">
      <h2>Voice</h2>
      <label>Voice
        <select id="voice"></select>
      </label>
      <label>Speed <span id="rate-val"></span>
        <input type="range" id="rate" min="0.6" max="1.1" step="0.05">
      </label>
      <button class="btn ghost" id="voice-test">Test voice</button>
    </section>
  </main>

  <div id="session" hidden>
    <div class="breath-wrap"><div id="circle"></div></div>
    <p id="label"></p>
    <p id="remaining"></p>
    <div class="controls">
      <button class="btn ghost" id="pause">Pause</button>
      <button class="btn ghost" id="stop">End</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
